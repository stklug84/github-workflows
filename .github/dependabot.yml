---
# title: Dependabot version updates configuration
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-06-11
# keywords: [infrastructure, dependencies]
# comment: |
#   Weekly version updates for GitHub Actions. The github-actions
#   ecosystem scans .github/workflows for "/", which covers every
#   `uses:` reference in the reusable workflows, including SHA-pinned
#   actions (the trailing version comment is kept in sync). Tool
#   versions installed inside run: steps (actionlint binary, pip/npm
#   installs) have no dependabot ecosystem and are maintained manually.
#   All action updates are grouped into a single pull request.
#   Documentation:
#   https://docs.github.com/code-security/dependabot/dependabot-version-updates
# ---

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
