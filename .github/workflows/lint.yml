---
# title: Lint workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-08-11
# keywords: [infrastructure, linting]
# comment: |
#   Lints the repository on pull requests against main via the reusable
#   repo-lint workflow published from this same repository:
#     - actionlint   : .github/workflows/* (incl. shellcheck on run: steps)
#     - yamllint     : all YAML files (.yamllint.yml)
#     - markdownlint : all Markdown files (.markdownlint.yml)
#
#   The local `./.github/workflows/` reference is deliberate: the catalog
#   lints itself with the working-tree copy of the workflow it publishes,
#   so a regression in repo-lint.yml fails this repository's own CI in
#   the same pull request that introduces it — a SHA pin would test the
#   previously released version instead.
#
#   Bash in this repository only exists inside workflow run: steps and is
#   covered by actionlint's shellcheck integration (.shellcheckrc).
# ---
name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/repo-lint.yml
