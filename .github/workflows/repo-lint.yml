---
# title: Repository lint workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-08-11
# keywords: [reusable-workflow, linting]
# comment: |
#   Reusable workflow: the repository-hygiene lint trio every repository
#   of this account runs — actionlint (workflow syntax, incl. shellcheck
#   over `run:` blocks), yamllint and markdownlint — plus an optional
#   hadolint job for repositories that ship a Dockerfile.
#
#   Consume from another repository:
#
#     jobs:
#       lint:
#         uses: stklug84/github-workflows/.github/workflows/repo-lint.yml@v3.0.0
#         with:
#           hadolint-dockerfile: ".github/docker/texlive/Dockerfile"
#
#   The linters read the calling repository's own configuration files
#   (.yamllint.yml, .markdownlint.yml, .shellcheckrc); this workflow only
#   supplies the runners and the pinned tool versions. Every job reports
#   its real pass/fail status (no continue-on-error). Consumers decide
#   which checks are blocking by listing them as required status checks
#   in branch protection / a ruleset; any job can also be toggled off
#   entirely via the run-* inputs. The hadolint job additionally requires
#   a non-empty `hadolint-dockerfile` and is skipped otherwise, so
#   repositories without a Dockerfile need no toggle.
#
#   Repository-specific linting (a shellcheck sweep over standalone
#   scripts, schema validation, ...) stays in the caller as extra jobs
#   alongside the `uses:` job.
# ---
name: Repository lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label for all jobs."
        type: string
        required: false
        default: "ubuntu-latest"
      actionlint-version:
        description: >-
          actionlint release to install, fetched with the project's own
          download-actionlint.bash script.
        type: string
        required: false
        default: "1.7.10"
      yamllint-version:
        description: >-
          Optional PEP 440 version specifier for yamllint (e.g.
          "==1.35.1"). Empty (the default) installs the latest release.
        type: string
        required: false
        default: ""
      yamllint-paths:
        description: "Space-separated files/directories passed to yamllint."
        type: string
        required: false
        default: "."
      yamllint-strict:
        description: >-
          Run yamllint with --strict, which turns warnings (line-length
          among them) into failures.
        type: boolean
        required: false
        default: true
      markdownlint-config:
        description: "Path to the markdownlint-cli2 configuration file."
        type: string
        required: false
        default: ".markdownlint.yml"
      markdownlint-globs:
        description: >-
          Newline-separated globs for markdownlint-cli2. The tool has no
          ignore file, so exclusions are negation globs (e.g. "!.venv").
        type: string
        required: false
        default: "**/*.md"
      hadolint-dockerfile:
        description: >-
          Dockerfile to lint with hadolint. Empty (the default) skips the
          hadolint job.
        type: string
        required: false
        default: ""
      run-actionlint:
        description: "Run the actionlint job."
        type: boolean
        required: false
        default: true
      run-yamllint:
        description: "Run the yamllint job."
        type: boolean
        required: false
        default: true
      run-markdownlint:
        description: "Run the markdownlint job."
        type: boolean
        required: false
        default: true
      run-hadolint:
        description: "Run the hadolint job (also requires hadolint-dockerfile)."
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint (workflows)
    runs-on: ${{ inputs.runs-on }}
    if: ${{ inputs.run-actionlint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download actionlint
        id: get-actionlint
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/rhysd/actionlint"
          bash <(curl -fsSL "$BASE/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "$ACTIONLINT_VERSION"

      # actionlint feeds every `run:` block through shellcheck, honouring
      # the calling repository's .shellcheckrc.
      - name: Run actionlint
        run: |
          set -euo pipefail
          ./actionlint -color

  yamllint:
    name: yamllint
    runs-on: ${{ inputs.runs-on }}
    if: ${{ inputs.run-yamllint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install yamllint
        env:
          YAMLLINT_VERSION: ${{ inputs.yamllint-version }}
        run: |
          set -euo pipefail
          pip install --user "yamllint${YAMLLINT_VERSION}"

      # Rules come from the calling repository's .yamllint.yml.
      - name: Run yamllint
        env:
          YAMLLINT_PATHS: ${{ inputs.yamllint-paths }}
          YAMLLINT_STRICT: ${{ inputs.yamllint-strict }}
        run: |
          set -euo pipefail
          strict=""
          if [ "$YAMLLINT_STRICT" = "true" ]; then
            strict="--strict"
          fi
          # Word splitting on YAMLLINT_PATHS is intended: it is a
          # space-separated path list.
          # shellcheck disable=SC2086
          yamllint $strict $YAMLLINT_PATHS

  markdownlint:
    name: markdownlint
    runs-on: ${{ inputs.runs-on }}
    if: ${{ inputs.run-markdownlint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          config: ${{ inputs.markdownlint-config }}
          globs: ${{ inputs.markdownlint-globs }}

  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ${{ inputs.runs-on }}
    # The hadolint action's `dockerfile` input has a default that points
    # at ./Dockerfile, so an empty input must skip the job rather than
    # silently lint a path the caller never named.
    if: ${{ inputs.run-hadolint && inputs.hadolint-dockerfile != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6  # v3.4.0
        with:
          dockerfile: ${{ inputs.hadolint-dockerfile }}
