---
# title: CodeQL workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-08-11
# keywords: [infrastructure, security]
# comment: |
#   CodeQL code scanning for the `actions` language, which analyzes the
#   reusable workflows in .github/workflows/* (expression injection,
#   excessive permissions, untrusted checkout, artifact/cache
#   poisoning, ...). The security-extended suite adds the unpinned-tag
#   query. Bash code is not a CodeQL language and is covered by
#   shellcheck via actionlint in the Lint workflow instead.
#
#   Like lint.yml, this calls the reusable workflow published from this
#   same repository through a local `./.github/workflows/` reference: the
#   catalog scans itself with the working-tree copy of the workflow it
#   publishes, so a regression fails the pull request that introduces it
#   rather than the next consumer.
# ---
name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly run to pick up newly released queries.
    - cron: '30 5 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    uses: ./.github/workflows/repo-codeql.yml
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      languages: '["actions"]'
