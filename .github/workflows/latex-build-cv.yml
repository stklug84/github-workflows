---
# title: Build LaTeX CVs workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-06-12
# keywords: [reusable-workflow, latex]
# comment: |
#   Reusable workflow: matrix-build every LaTeX CV variant discovered under
#   `root` (default cvs/*/) inside a digest-pinned TeX Live container, then
#   combine all PDFs into a single artifact named after the calling repo.
#   Optionally (release: 'true') publish the PDFs as a versioned GitHub
#   release (tag v<YYYY.MM.DD>-r<run-number>) on push events, pruned to the
#   `release-keep` newest releases.
#
#   Consume from another repository:
#
#     jobs:
#       build:
#         # Only needed when release: 'true'; otherwise contents: read.
#         permissions:
#           contents: write
#         uses: stklug84/github-workflows/.github/workflows/latex-build-cv.yml@v1.5.0
#         with:
#           texinputs: ".:../..:../../styles:../../images:"
#           release: "true"
#           release-keep: "10"
#
#   The TeX Live container image is resolved from the caller's Dockerfile
#   (see `texlive-dockerfile`), so Dependabot's docker ecosystem in the
#   calling repo keeps the digest pin current. The caller SHOULD set a
#   concurrency group and needs `contents: read`, or `contents: write`
#   when releases are enabled.
#
#   Built-in generation (recommended): set `generate: 'true'` and the
#   workflow runs a `generate` job that expands the caller's build-matrix
#   manifest (`generate-manifest`, default data/variants.yml) into the
#   variant tree under `root` via the stklug84/actions/cv/generate
#   composite action, hands it to discovery and the build internally, and
#   needs no `generate` job in the caller:
#
#     jobs:
#       build:
#         permissions:
#           contents: write
#         uses: stklug84/github-workflows/.github/workflows/latex-build-cv.yml@v1.8.0
#         with:
#           generate: "true"
#           texinputs: ".:../../..:../../../styles:../../../images:"
#           release: "true"
#
#   Manual prebuild handoff (legacy): set `prebuild-artifact` to the name
#   of an artifact uploaded by a separate `generate` job in the caller
#   (wired via `needs: generate`). After this workflow checks out the repo
#   and BEFORE it builds, that artifact is downloaded and extracted into
#   `prebuild-into` (default repo root), so generated `.tex` files can
#   override or supply files for the build. Both inputs are optional and
#   default to a no-op (empty `prebuild-artifact`), so existing callers are
#   unaffected.
# ---
name: Build LaTeX CVs

on:
  workflow_call:
    inputs:
      texinputs:
        description: >-
          TEXINPUTS search path used while compiling each variant,
          resolved relative to the variant directory. The default matches
          the conventional layout: shared assets (personal-info.tex,
          styles/*.sty, images/) at the repo root, variants in
          <root>/<name>/.
        type: string
        required: false
        default: ".:../..:../../styles:../../images:"
      root:
        description: "Directory scanned for CV variants (one subdir each)."
        type: string
        required: false
        default: "cvs"
      default-engine:
        description: "Engine used for variants without an .engine file."
        type: string
        required: false
        default: "latexmk"
      local:
        description: >-
          Set to 'true' when running locally via gh act (skips artifact
          upload). Auto-detected when the ACT environment variable is set.
        type: string
        required: false
        default: "false"
      texlive-dockerfile:
        description: >-
          Path (in the calling repo) to the Dockerfile whose FROM line
          pins the TeX Live container image.
        type: string
        required: false
        default: ".github/docker/texlive/Dockerfile"
      runs-on:
        description: "Runner label for all jobs."
        type: string
        required: false
        default: "ubuntu-latest"
      release:
        description: >-
          Set to 'true' to publish the combined PDFs as a versioned
          GitHub release (tag v<YYYY.MM.DD>-r<run-number>) when the
          workflow runs on a push event. Requires the caller to grant
          `contents: write` on the calling job.
        type: string
        required: false
        default: "false"
      release-keep:
        description: >-
          Retention cap for releases created by this workflow: keep only
          the N newest releases (matching the v<YYYY.MM.DD>-r<N> tag
          pattern) and delete older ones including their tags. '0'
          disables pruning (keep everything).
        type: string
        required: false
        default: "0"
      generate:
        description: >-
          Set to 'true' to run the built-in `generate` job, which expands
          a CV build-matrix manifest into the variant tree (via the
          stklug84/actions/cv/generate composite action) BEFORE discovery
          and build. The generated tree is handed to the build through the
          internal prebuild artifact, so the caller needs no `generate`
          job of its own. When 'false' (the default), the repository is
          expected to already contain the variant tree under `root`.
        type: string
        required: false
        default: "false"
      generate-manifest:
        description: >-
          Path (in the calling repo) to the build-matrix manifest consumed
          by the built-in generate job (styles + langs + cvs). Ignored
          when `generate` is not 'true'.
        type: string
        required: false
        default: "data/variants.yml"
      generate-templates-dir:
        description: >-
          Directory (in the calling repo) of per-style Jinja2 main
          templates (<style>.tex.j2) used by the built-in generate job.
          Ignored when `generate` is not 'true'.
        type: string
        required: false
        default: "templates"
      generate-data-dir:
        description: >-
          Directory (in the calling repo) holding the source YAMLs
          referenced by the manifest. Ignored when `generate` is not
          'true'.
        type: string
        required: false
        default: "data"
      generate-main-name:
        description: >-
          Basename (without .tex) for every generated leaf main file.
          Ignored when `generate` is not 'true'.
        type: string
        required: false
        default: "sklug-cv"
      prebuild-artifact:
        description: >-
          Optional name of an artifact (uploaded by a separate caller
          `generate` job, wired via `needs: generate`) to download AFTER
          checkout and BEFORE the build. Used to hand generated `.tex`
          files to the build. Empty
          (the default) skips the download entirely — a no-op preserving
          the prior behavior for existing callers. When the built-in
          `generate` job runs (`generate: 'true'`), this workflow sets the
          prebuild handoff internally and the caller should leave this
          empty.
        type: string
        required: false
        default: ""
      prebuild-into:
        description: >-
          Directory into which `prebuild-artifact` is extracted (default
          repo root, "."). The artifact's internal file tree is laid down
          relative to this path, so the artifact should contain files at
          their final repo-relative locations (see the EXPECTED ARTIFACT
          LAYOUT comment in the `build` job). Ignored when
          `prebuild-artifact` is empty.
        type: string
        required: false
        default: "."

# Least-privilege token: this workflow only reads the repo and uploads
# artifacts.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Dynamic artifact-name prefix. Never hardcoded; derived from the
  # calling repository name so the workflow is fully portable.
  # Note: artifact names may not contain '/'. Repo names usually don't either.
  ARTIFACT_PREFIX: ${{ github.event.repository.name }}
  # Internal artifact carrying the freshly generated variant tree from
  # the built-in `generate` job to `discover` and `build`. Scoped per run
  # so concurrent runs never collide.
  GENERATED_ARTIFACT: cv-generated-tree-${{ github.run_id }}

jobs:
  # =====================================================================
  #  generate
  #
  #  Opt-in (generate: 'true'). Expands the caller's build-matrix
  #  manifest into the variant tree via the central
  #  stklug84/actions/cv/generate composite action, then uploads that
  #  tree as an internal artifact consumed by `discover` and `build`.
  #  All generation logic lives in the composite action, so the caller
  #  keeps a single thin `uses:` block and needs no generate job.
  # =====================================================================
  generate:
    if: inputs.generate == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate CV variant tree
        # Pinned to the actions v2.15.0 release: cv/generate skips CV
        # sources named in the manifest but absent from the checkout; the
        # bundled cv/parse emits meta.location/title/summary, tagged
        # experience bullets, the two-line name split (firstname/lastname),
        # the conference location heatmap (lat/lon -> \cvheatmap), per-item
        # tagged skill bars ({name,size} -> \cvskillitembar), data-driven
        # interest icons (interests[].icon -> \cvinterest), structured
        # certifications (code/name/issuer -> tagged \cvcertlist/\cvcert,
        # chips aligned to the section heading; other styles unchanged), an
        # optional meta.pdf_title backing the PDF metadata title (absent ->
        # "Lebenslauf") and \@-spacing auto-injected into meta.author so
        # the YAML carries no hand-written LaTeX (pdf_author left literal).
        # v2.13.0 added style-dependent schema profiles (plain-string skills
        # + certifications[].text vs {name,size} skills + structured certs +
        # the tagged-only concepts/icon/lat-lon fields). v2.15.0 makes them
        # PER ENTRY for merged multi-style sources: cv/generate passes each
        # leaf's manifest style name (--target-style) and the styles
        # registry (--valid-targets) to cv/parse, which selects the entries
        # whose `targets` name that style (or the generic `latex`), applies
        # the optional per-style overrides.<style> meta/contact block, and
        # deep-merges a gitignored sibling <source>.local.yml overlay (for
        # local-only PII fields) when present.
        uses: stklug84/actions/cv/generate@fcf81eaf154cfbf73ba88118d5c045dbf5c3815e  # v2.17.0
        with:
          manifest: ${{ inputs.generate-manifest }}
          templates-dir: ${{ inputs.generate-templates-dir }}
          cvs-root: ${{ inputs.root }}
          data-dir: ${{ inputs.generate-data-dir }}
          main-name: ${{ inputs.generate-main-name }}

      # Skipped in local mode (gh act / ACT=true): act runs every job
      # against the same bind-mounted host workspace, so the variant tree
      # written above already persists to `discover` and `build` without an
      # artifact round-trip. act also provides no artifact backend
      # (ACTIONS_RUNTIME_TOKEN is unset), so upload-artifact would fail.
      - name: Upload generated variant tree
        if: inputs.local != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GENERATED_ARTIFACT }}
          path: |
            ${{ inputs.root }}/**/*.tex
            ${{ inputs.root }}/**/.engine
          # The per-variant .engine dotfile selects the TeX engine
          # (e.g. xelatex for XeTeX-only styles). upload-artifact excludes
          # dotfiles by default, which would drop every .engine and force
          # the build to fall back to pdflatex -- breaking XeTeX styles.
          # Opt in to hidden files so .engine survives the round-trip.
          include-hidden-files: true
          # A zero-variant generate is legitimate: every CV source named in
          # the manifest may be local-only/gitignored (PII) and therefore
          # absent from this checkout, so cv/generate skips them all. In
          # that case no artifact is produced and the downstream
          # download/discover/build/package jobs degrade to no-ops (an
          # empty discover matrix), keeping the run green.
          if-no-files-found: warn

  # =====================================================================
  #  discover
  #
  #  Delegates variant discovery to the central
  #  stklug84/actions/texlive/discover-variants composite action, which
  #  scans <root>/*/ and emits a JSON matrix consumed by the `build`
  #  job. No filenames are hardcoded in this workflow.
  # =====================================================================
  discover:
    needs: [generate]
    # Run whether or not the optional `generate` job executed: a skipped
    # `needs` job would otherwise skip this one too. Proceed unless an
    # upstream job actually failed or the run was cancelled.
    if: always() && !failure() && !cancelled()
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      local: ${{ steps.cfg.outputs.local }}
      texlive-image: ${{ steps.texlive.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # In local mode (gh act) every job shares one bind-mounted
          # workspace, so the generate job's variant tree is already on
          # disk here. The default clean (git clean -ffdx) would wipe that
          # gitignored tree before discovery scans it, so disable cleaning
          # locally. Hosted CI keeps the default clean checkout.
          clean: ${{ inputs.local != 'true' }}

      # When the built-in generate job ran, lay its tree down under the
      # variant root so discovery scans the freshly generated variants.
      # upload-artifact strips the common parent of the uploaded glob
      # (cvs/**), so the artifact's internal tree is rooted at the variant
      # dirs (e.g. <yaml>-<lang>/<style>/...). Download into `inputs.root`
      # to restore the cvs/<yaml>-<lang>/<style>/ layout that scan.sh and
      # the build job expect; downloading into "." would land the tree at
      # the repo root and discover would find no variants.
      # Non-fatal: on a zero-variant generate run the artifact is never
      # produced (see the generate job's upload note). Missing artifact ->
      # empty tree under root -> discover emits an empty matrix -> build is
      # a no-op. download-artifact errors on a missing name, so swallow it.
      # Skipped in local mode (gh act): no artifact is produced there; the
      # generate job's tree already persists in the bind-mounted workspace.
      - name: Download generated variant tree
        if: inputs.generate == 'true' && inputs.local != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.GENERATED_ARTIFACT }}
          path: ${{ inputs.root }}

      - name: Resolve pinned TeX Live image
        id: texlive
        shell: bash
        env:
          DOCKERFILE: ${{ inputs.texlive-dockerfile }}
        run: |
          set -euo pipefail
          # Single source of truth for the TeX Live container image. The
          # Dockerfile exists so Dependabot (docker ecosystem) can keep
          # the digest pin current; we only consume its FROM reference.
          image="$(awk '/^FROM /{print $2; exit}' "$DOCKERFILE")"
          if [ -z "$image" ]; then
            echo "::error::No FROM line found in $DOCKERFILE"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved TeX Live image: $image"

      - name: Resolve local mode
        id: cfg
        shell: bash
        env:
          LOCAL_IN: ${{ inputs.local }}
        run: |
          set -euo pipefail
          # nektos/act exports ACT=true; treat that as implicit local mode.
          LOCAL="${LOCAL_IN:-${ACT:+true}}"
          LOCAL="${LOCAL:-false}"
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "Resolved local=$LOCAL (ACT=${ACT:-unset})"

      - name: Discover CV variants
        id: scan
        # Pinned to actions v2.15.0: scan.sh recurses to any depth (for the
        # nested cvs/<yaml>-<lang>/<style>/ layout) and emits an empty
        # matrix instead of failing when there are no variants to build.
        uses: stklug84/actions/texlive/discover-variants@fcf81eaf154cfbf73ba88118d5c045dbf5c3815e  # v2.17.0
        with:
          root: ${{ inputs.root }}
          default-engine: ${{ inputs.default-engine }}

  # =====================================================================
  #  build
  #
  #  Matrix build, one leg per discovered CV variant. The matrix entry
  #  is pure data (name, dir, main, engine, aux-tool flags); all build
  #  behavior lives in the central stklug84/actions/texlive/build-pdf
  #  composite action. Adding a new engine or aux tool means editing
  #  that action, never this workflow.
  # =====================================================================
  build:
    needs: discover
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    container:
      # Digest-pinned via the caller's Dockerfile (texlive-dockerfile
      # input); kept current by the caller's Dependabot docker ecosystem.
      image: ${{ needs.discover.outputs.texlive-image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # In local mode (gh act) the bind-mounted workspace already holds
          # the generate job's variant tree; the default clean would wipe
          # that gitignored tree before the build reads it. Hosted CI keeps
          # the default clean checkout.
          clean: ${{ needs.discover.outputs.local != 'true' }}

      # Built-in generate handoff: when the workflow ran its own generate
      # job, lay the generated variant tree down under the variant root
      # before the build so each leaf's freshly rendered files override any
      # committed fallback. upload-artifact strips the cvs/ parent from the
      # uploaded glob, so download into `inputs.root` to restore the
      # cvs/<yaml>-<lang>/<style>/ layout the build matrix paths reference
      # (matching the discover job's download). Mirrors the caller-driven
      # prebuild path below.
      # Skipped in local mode (gh act): no artifact is produced there; the
      # generate job's tree already persists in the bind-mounted workspace.
      - name: Download generated variant tree
        if: inputs.generate == 'true' && needs.discover.outputs.local != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.GENERATED_ARTIFACT }}
          path: ${{ inputs.root }}

      # Prebuild artifact handoff. Runs only when the caller
      # passes a non-empty `prebuild-artifact`; otherwise it is a no-op
      # via the `if:` guard, so existing callers are unaffected. The
      # artifact is extracted relative to `prebuild-into` (default repo
      # root ".") AFTER checkout and BEFORE the build, so generated files
      # override / supply build inputs.
      #
      # EXPECTED ARTIFACT LAYOUT (prebuild-into="."): the artifact's
      # internal file tree is extracted relative to the repo root, so it
      # must contain files already under their variant directories, e.g.:
      #     cvs/photo-2page/cv-experience.tex
      #     cvs/photo-2page/personal-info.tex
      #     cvs/sidebar/cv-experience.tex
      #     cvs/sidebar/personal-info.tex
      # (i.e. one generated copy per variant, at the same paths the build
      # reads them from). download-artifact is pinned to @v8 to match the
      # package/release jobs below.
      - name: Download prebuild artifact
        if: inputs.prebuild-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.prebuild-artifact }}
          path: ${{ inputs.prebuild-into }}

      - name: Build ${{ matrix.name }} (${{ matrix.engine }})
        uses: stklug84/actions/texlive/build-pdf@fcf81eaf154cfbf73ba88118d5c045dbf5c3815e  # v2.17.0
        with:
          working-directory: ${{ matrix.dir }}
          main: ${{ matrix.main }}
          engine: ${{ matrix.engine }}
          # Resolve shared assets from inside <root>/<name>/ (see the
          # texinputs input description for the conventional layout).
          texinputs: ${{ inputs.texinputs }}
          has-bib: ${{ matrix.has_bib }}
          has-biblatex: ${{ matrix.has_biblatex }}
          has-index: ${{ matrix.has_index }}
          has-glossaries: ${{ matrix.has_glossaries }}
          has-psfrag: ${{ matrix.has_psfrag }}

      - name: Upload PDF artifact
        if: needs.discover.outputs.local != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.name }}-pdf
          path: ${{ matrix.dir }}/${{ matrix.main }}.pdf
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure() && needs.discover.outputs.local != 'true'
        uses: stklug84/actions/texlive/upload-build-logs@fcf81eaf154cfbf73ba88118d5c045dbf5c3815e  # v2.17.0
        with:
          artifact-name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.name }}-logs
          paths: |
            ${{ matrix.dir }}/*.log
            ${{ matrix.dir }}/*.blg
            ${{ matrix.dir }}/*.ilg

  # =====================================================================
  #  package
  #
  #  Collects every per-CV PDF artifact (<repo>-<name>-pdf) into a
  #  single combined artifact named after the repo. Each PDF is placed
  #  in its own subfolder (the artifact name) to avoid collisions.
  # =====================================================================
  package:
    needs: [discover, build]
    if: needs.discover.outputs.local != 'true'
    runs-on: ${{ inputs.runs-on }}
    # actions: read is required for `gh run download` / the run-artifacts
    # REST API; the workflow default (contents: read) does not grant it.
    permissions:
      contents: read
      actions: read
    steps:
      # Per-name download (one subdir per artifact) for any variant count.
      # Mirrors the release job: actions/download-artifact's `pattern:` mode
      # flattens a *single* matching artifact directly into `path`, which
      # would make the combined artifact's internal tree differ between the
      # 1-variant and N-variant cases. `gh run download --name <n> --dir`
      # always nests, keeping ./dist/<name>/<main>.pdf stable for 1..N.
      - name: Download all per-CV PDF artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PREFIX: ${{ env.ARTIFACT_PREFIX }}
        run: |
          set -euo pipefail
          mkdir -p ./dist
          mapfile -t names < <(
            gh api --paginate \
              "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[].name' \
            | grep -E "^${PREFIX}-.*-pdf$" || true
          )
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::No ${PREFIX}-*-pdf artifacts found for run ${RUN_ID}."
            exit 1
          fi
          echo "Found ${#names[@]} PDF artifact(s); downloading per-name."
          for name in "${names[@]}"; do
            echo "Downloading $name -> ./dist/$name"
            gh run download "${RUN_ID}" --name "$name" --dir "./dist/$name"
          done

      - name: List combined artifact contents
        shell: bash
        run: |
          set -euo pipefail
          find ./dist -type f -print

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}
          path: ./dist/*
          if-no-files-found: error

  # =====================================================================
  #  release
  #
  #  Opt-in (release: 'true'), push events only. Publishes every built
  #  PDF as a versioned GitHub release tagged v<YYYY.MM.DD>-r<run-number>
  #  (unique and chronologically sortable; GitHub marks the newest as
  #  "Latest release", so `gh release download` without a tag always
  #  fetches the current PDFs). When release-keep > 0, older releases
  #  matching the same tag pattern are pruned together with their tags
  #  (gh release delete --cleanup-tag), and a follow-up sweep deletes any
  #  workflow-pattern tag left orphaned (no matching release) by older runs
  #  or a partial prune. Manually created releases or tags in other formats
  #  are never touched.
  # =====================================================================
  release:
    needs: [discover, package]
    if: >-
      inputs.release == 'true' &&
      github.event_name == 'push' &&
      needs.discover.outputs.local != 'true'
    runs-on: ${{ inputs.runs-on }}
    # contents: write publishes the release; actions: read is required for
    # `gh run download` / the run-artifacts REST API (not granted by the
    # workflow default of contents: read).
    permissions:
      contents: write
      actions: read
    steps:
      # Download every per-CV PDF artifact into its OWN subdir, one dir per
      # artifact name, for any variant count (1..N). We deliberately avoid
      # actions/download-artifact's `pattern:` mode here: with a *single*
      # matching artifact it extracts the PDF flat into `path` (./dist/x.pdf)
      # instead of nesting it (./dist/<name>/x.pdf), which the flatten step
      # below depends on. `gh run download --name <n> --dir ./dist/<n>`
      # always nests, so the ./dist/<name>/<main>.pdf layout holds whether
      # one or many variants were built.
      - name: Download all per-CV PDF artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PREFIX: ${{ env.ARTIFACT_PREFIX }}
        run: |
          set -euo pipefail
          mkdir -p ./dist
          # List this run's artifacts whose names match <prefix>-*-pdf.
          mapfile -t names < <(
            gh api --paginate \
              "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[].name' \
            | grep -E "^${PREFIX}-.*-pdf$" || true
          )
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::No ${PREFIX}-*-pdf artifacts found for run ${RUN_ID}."
            exit 1
          fi
          echo "Found ${#names[@]} PDF artifact(s); downloading per-name."
          for name in "${names[@]}"; do
            echo "Downloading $name -> ./dist/$name"
            gh run download "${RUN_ID}" --name "$name" --dir "./dist/$name"
          done

      - name: Flatten release assets
        shell: bash
        env:
          PREFIX: ${{ env.ARTIFACT_PREFIX }}
        run: |
          set -euo pipefail
          mkdir -p ./assets
          shopt -s nullglob
          # Each per-CV PDF lives in its own artifact subdir (guaranteed by
          # the per-name download above, for any variant count):
          #   ./dist/<repo>-<name>-pdf/<main>.pdf
          # Every leaf main shares one basename (e.g. sklug-cv.pdf), so a
          # flat copy by basename collides and only one variant survives in
          # the release. Derive a unique name from the artifact dir instead:
          # strip the "<repo>-" prefix and "-pdf" suffix, drop the style
          # segment's leading "cv-", and prefix "stklug-".
          for pdf in ./dist/*/*.pdf; do
            d="$(basename "$(dirname "$pdf")")"   # <repo>-<name>-pdf
            variant="${d#"${PREFIX}-"}"            # strip "<repo>-"
            variant="${variant%-pdf}"             # strip "-pdf"
            variant="$(printf '%s' "$variant" | sed 's/-cv-/-/')"
            cp -v "$pdf" "./assets/stklug-${variant}.pdf"
          done
          if [ -z "$(ls -A ./assets)" ]; then
            echo "::error::No PDFs found to release."
            exit 1
          fi

      - name: Create versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          TAG="v$(date +%Y.%m.%d)-r${GITHUB_RUN_NUMBER}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TITLE="CVs $(date +%Y-%m-%d) ($SHORT_SHA)"
          SUBJECT="$(printf '%s\n' "$COMMIT_SUBJECT" | head -n1)"
          {
            echo "Built from $GITHUB_SHA"
            echo
            echo "Commit: $SUBJECT"
            echo
            echo "Variants:"
            for f in ./assets/*.pdf; do
              echo "- $(basename "$f")"
            done
          } > notes.md
          gh release create "$TAG" ./assets/*.pdf \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file notes.md
          echo "Published release $TAG"

      - name: Prune old releases
        if: inputs.release-keep != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ inputs.release-keep }}
        run: |
          set -euo pipefail
          # Workflow tag pattern: v<YYYY.MM.DD>-r<N>. Only releases/tags
          # matching it are ever touched; manually created releases or tags
          # in other formats are left alone.
          PATTERN='^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-r[0-9]+$'

          # (1) Prune old RELEASES (newest first by creation date), deleting
          #     each release together with its underlying git tag.
          mapfile -t tags < <(
            gh release list --limit 1000 \
              --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep -E "$PATTERN" || true
          )
          echo "Found ${#tags[@]} workflow release(s); keeping newest $KEEP."
          for ((i = KEEP; i < ${#tags[@]}; i++)); do
            echo "Pruning release ${tags[$i]} (and its tag)"
            gh release delete "${tags[$i]}" --cleanup-tag --yes
          done

          # (2) Sweep ORPHAN TAGS: workflow-pattern tags with no matching
          #     release (e.g. left behind by older runs that deleted the
          #     release without --cleanup-tag, or a partially failed prune).
          #     `gh release delete --cleanup-tag` only removes the tag of a
          #     still-existing release, so it can never reclaim these; delete
          #     them directly via the git-refs API.
          mapfile -t release_tags < <(
            gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -E "$PATTERN" || true
          )
          mapfile -t all_tags < <(
            gh api --paginate "repos/${GH_REPO}/tags" --jq '.[].name' \
            | grep -E "$PATTERN" || true
          )
          for tag in "${all_tags[@]}"; do
            keep_tag=""
            for rt in "${release_tags[@]}"; do
              if [ "$tag" = "$rt" ]; then keep_tag="yes"; break; fi
            done
            if [ -z "$keep_tag" ]; then
              echo "Deleting orphan tag $tag (no matching release)"
              gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${tag}"
            fi
          done
