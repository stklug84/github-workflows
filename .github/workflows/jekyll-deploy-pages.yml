---
# title: Deploy Jekyll to GitHub Pages workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-06-08
# keywords: [reusable-workflow, jekyll]
# comment: |
#   Reusable workflow: build a Jekyll site with Bundler and deploy it to GitHub Pages.
#
#   Consume from another repository:
#
#     jobs:
#       deploy:
#         uses: stklug84/github-workflows/.github/workflows/jekyll-deploy-pages.yml@v1.2.0
#
#   The caller MUST grant the required permissions (contents: read, pages: write,
#   id-token: write) and SHOULD set a "pages" concurrency group. See README.md.
#
#   Prebuild artifact handoff: set `prebuild-artifact` to the name
#   of an artifact uploaded by a separate caller `generate` job (wired via
#   `needs: generate`). It is downloaded and extracted into `prebuild-into`
#   (typically `_data`, e.g. a generated `cv.yml`) AFTER checkout + Ruby/Pages
#   setup and BEFORE `jekyll-build`, so the generated data is present when
#   Jekyll runs. Both inputs are optional; empty `prebuild-artifact` is a no-op
#   and leaves existing callers unaffected.
# ---
name: Deploy Jekyll to GitHub Pages

on:
  workflow_call:
    inputs:
      source:
        description: "Jekyll source directory."
        type: string
        required: false
        default: "./"
      destination:
        description: "Build output directory (uploaded as the Pages artifact)."
        type: string
        required: false
        default: "./_site"
      runs-on:
        description: "Runner label for both jobs."
        type: string
        required: false
        default: "ubuntu-latest"
      environment-name:
        description: "Deployment environment name."
        type: string
        required: false
        default: "github-pages"
      ruby-version:
        description: >-
          Ruby version for ruby/setup-ruby. Leave empty to let setup-ruby
          resolve it from .ruby-version / .tool-versions / Gemfile.
        type: string
        required: false
        default: ""
      checkout-ref:
        description: "Optional git ref to build. Defaults to the caller's ref."
        type: string
        required: false
        default: ""
      prebuild-artifact:
        description: >-
          Optional name of an artifact (uploaded by a separate caller
          `generate` job, wired via `needs: generate`) to download BEFORE
          the Jekyll build. Used to hand generated files (e.g. a
          generated `_data/cv.yml`) to the build. Empty (the default)
          skips the download — a
          no-op preserving prior behavior for existing callers.
        type: string
        required: false
        default: ""
      prebuild-into:
        description: >-
          Directory into which `prebuild-artifact` is extracted. For
          Jekyll the typical value is `_data` and the artifact contains
          `cv.yml`. Defaults to the repo root ("."). Ignored when
          `prebuild-artifact` is empty.
        type: string
        required: false
        default: "."

# Reusable workflows do not inherit the caller's permissions block; they must
# declare their own. The caller still has to grant at least these scopes.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        # Trust model: `checkout-ref` is a workflow_call input and can only be
        # set in the caller's committed workflow file (write access required).
        # Callers MUST NOT wire PR-controlled refs into this deploy workflow.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0

      - name: Setup Ruby with Bundler
        uses: stklug84/actions/ruby/setup-ruby-bundler@3edfff92a595c0e2365459f70bfe02b97311f0d7  # v2.18.0
        with:
          ruby-version: ${{ inputs.ruby-version }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      # Prebuild artifact handoff. Chosen step order:
      #   checkout -> setup ruby -> setup pages -> (download prebuild) -> build
      # The download runs immediately BEFORE jekyll-build so the extracted
      # files (e.g. _data/cv.yml when prebuild-into="_data") are present
      # when Jekyll reads them. Setup steps run first because they only
      # configure the toolchain and never touch the source tree, so the
      # generated data is never clobbered. No-op when prebuild-artifact is
      # empty (existing callers unaffected). Pinned to @v8 to match the
      # download-artifact major used by the sibling jekyll-* workflows.
      - name: Download prebuild artifact
        if: inputs.prebuild-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.prebuild-artifact }}
          path: ${{ inputs.prebuild-into }}

      - name: Build with Jekyll (Bundler)
        # configure-pages exports the correct baseurl for project sites.
        uses: stklug84/actions/jekyll/jekyll-build@3edfff92a595c0e2365459f70bfe02b97311f0d7  # v2.18.0
        with:
          source: ${{ inputs.source }}
          destination: ${{ inputs.destination }}
          baseurl: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ inputs.destination }}

  deploy:
    needs: build
    runs-on: ${{ inputs.runs-on }}
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
