---
# Reusable workflow: build a Jekyll site (Bundler) and run quality checks.
# Intended for pull-request validation.
#
# Consume from another repository:
#
#   jobs:
#     validate:
#       uses: stklug84/github-workflows/.github/workflows/jekyll-validate-pages.yml@v1.2.0
#
# Every job reports its real pass/fail status (no continue-on-error). The
# `build` job is the primary gate; the quality jobs (html-validate,
# link-check, spell-check, yaml-lint, actions-lint, markdown-lint) fail the
# check when their tool reports problems. Consumers decide which checks are
# blocking by listing them as required status checks in branch protection /
# a ruleset; any job can also be toggled off entirely via the run-* inputs.
#
# Prebuild artifact handoff: set `prebuild-artifact` to the name
# of an artifact uploaded by a separate caller `generate` job (wired via
# `needs: generate`). It is downloaded into `prebuild-into` (typically
# `_data`, e.g. a generated `cv.yml`) BEFORE the Jekyll build, so PR
# validation builds against the generated data. Both inputs are optional;
# empty `prebuild-artifact` is a no-op leaving existing callers unaffected.
name: Validate Jekyll Pages

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label for all jobs."
        type: string
        required: false
        default: "ubuntu-latest"
      source:
        description: "Jekyll source directory."
        type: string
        required: false
        default: "./"
      destination:
        description: "Build output directory."
        type: string
        required: false
        default: "./_site"
      ruby-version:
        description: >-
          Ruby version for ruby/setup-ruby. Leave empty to resolve from
          .ruby-version / .tool-versions / Gemfile.
        type: string
        required: false
        default: ""
      node-version:
        description: "Node version for the html-validate job."
        type: string
        required: false
        default: "20"
      html-validate-version:
        description: "html-validate npm version to install."
        type: string
        required: false
        default: "9"
      cspell-config:
        description: "Path to the cspell config file."
        type: string
        required: false
        default: ".cspell.json"
      yamllint-config:
        description: "Path to the yamllint config file."
        type: string
        required: false
        default: ".yamllint.yml"
      yamllint-paths:
        description: "Space-separated paths for yamllint to check."
        type: string
        required: false
        default: ".github/ _config.yml"
      markdownlint-globs:
        description: "Globs for markdownlint-cli2."
        type: string
        required: false
        default: "**/*.md"
      run-html-validate:
        description: "Run the html-validate job."
        type: boolean
        required: false
        default: true
      run-link-check:
        description: "Run the link-check job."
        type: boolean
        required: false
        default: true
      run-spell-check:
        description: "Run the spell-check job."
        type: boolean
        required: false
        default: true
      run-yaml-lint:
        description: "Run the yaml-lint job."
        type: boolean
        required: false
        default: true
      run-actions-lint:
        description: "Run the actions-lint job."
        type: boolean
        required: false
        default: true
      run-markdown-lint:
        description: "Run the markdown-lint job."
        type: boolean
        required: false
        default: true
      prebuild-artifact:
        description: >-
          Optional name of an artifact (uploaded by a separate caller
          `generate` job, wired via `needs: generate`) to download BEFORE
          the Jekyll build, so PR validation builds against generated
          files (e.g. a generated `_data/cv.yml`). Empty (the default)
          skips the download — a
          no-op preserving prior behavior for existing callers.
        type: string
        required: false
        default: ""
      prebuild-into:
        description: >-
          Directory into which `prebuild-artifact` is extracted. For
          Jekyll the typical value is `_data` and the artifact contains
          `cv.yml`. Defaults to the repo root ("."). Ignored when
          `prebuild-artifact` is empty.
        type: string
        required: false
        default: "."

permissions:
  contents: read

jobs:
  # Meaningful gate — wire this into branch protection as `<caller-job> / build`.
  build:
    name: build
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby with Bundler
        uses: stklug84/actions/ruby/setup-ruby-bundler@cb91fdcefccd47f24449549389216a5981a6455c  # v1
        with:
          ruby-version: ${{ inputs.ruby-version }}

      # Prebuild artifact handoff. Chosen step order:
      #   checkout -> setup ruby -> (download prebuild) -> build
      # The download runs immediately BEFORE jekyll-build so the extracted
      # files (e.g. _data/cv.yml when prebuild-into="_data") are present
      # when Jekyll reads them. No-op when prebuild-artifact is empty
      # (existing callers unaffected). Pinned to @v8 to match the
      # download-artifact major used elsewhere in this workflow.
      - name: Download prebuild artifact
        if: inputs.prebuild-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.prebuild-artifact }}
          path: ${{ inputs.prebuild-into }}

      - name: Build with Jekyll (Bundler)
        uses: stklug84/actions/jekyll/jekyll-build@cb91fdcefccd47f24449549389216a5981a6455c  # v1
        with:
          source: ${{ inputs.source }}
          destination: ${{ inputs.destination }}

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ inputs.destination }}
          retention-days: 1

  html-validate:
    name: html-validate
    runs-on: ${{ inputs.runs-on }}
    needs: build
    if: ${{ inputs.run-html-validate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install html-validate
        env:
          HTML_VALIDATE_VERSION: ${{ inputs.html-validate-version }}
        run: npm install --no-save "html-validate@${HTML_VALIDATE_VERSION}"
      - name: Run html-validate
        run: npx html-validate "_site/**/*.html"

  link-check:
    name: link-check
    runs-on: ${{ inputs.runs-on }}
    needs: build
    if: ${{ inputs.run-link-check }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2
        with:
          args: >-
            --no-progress
            --max-redirects 5
            --cache
            --max-cache-age 1d
            --accept 200,204,206,301,302,303,307,308
            --exclude 'mailto:'
            --root-dir "$GITHUB_WORKSPACE/_site"
            _site

  spell-check:
    name: spell-check
    runs-on: ${{ inputs.runs-on }}
    if: ${{ inputs.run-spell-check }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run cspell
        uses: streetsidesoftware/cspell-action@de2a73e963e7443969755b648a1008f77033c5b2  # v8
        with:
          config: ${{ inputs.cspell-config }}
          incremental_files_only: false

  yaml-lint:
    name: yaml-lint
    runs-on: ${{ inputs.runs-on }}
    if: ${{ inputs.run-yaml-lint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install yamllint
        run: pipx install yamllint
      - name: Run yamllint
        env:
          YAMLLINT_CONFIG: ${{ inputs.yamllint-config }}
          YAMLLINT_PATHS: ${{ inputs.yamllint-paths }}
        run: |
          set -eu
          # shellcheck disable=SC2086
          yamllint -c "$YAMLLINT_CONFIG" $YAMLLINT_PATHS

  actions-lint:
    name: actions-lint
    runs-on: ${{ inputs.runs-on }}
    if: ${{ inputs.run-actions-lint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8  # v2

  markdown-lint:
    name: markdown-lint
    runs-on: ${{ inputs.runs-on }}
    if: ${{ inputs.run-markdown-lint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd  # v23
        with:
          globs: ${{ inputs.markdownlint-globs }}
